name: Actualités et veille financements (espace membres)

on:
  schedule:
    - cron: "17 6 * * *"   # tous les jours vers 6 h (heure de Dakar)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_news.py
      - run: python scripts/fetch_funding.py
      - name: Enregistrer si changement
        run: |
          git config user.name "surfrider-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json data/funding.json
          git diff --cached --quiet || (git commit -m "Veille : actualités et financements mis à jour" && git push)
