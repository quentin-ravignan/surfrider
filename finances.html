<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Finances – Surfrider Sénégal</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0072BC">
  <link rel="icon" href="assets/img/logo-symbole-bleu.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/config.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/main.js" defer></script>
  <script src="assets/js/auth.js" defer></script>
  <script src="assets/js/admin-data.js" defer></script>
</head>
<body>
  <div data-site-header></div>
  <main class="section">
    <div class="container">
      <span class="eyebrow">Réservé aux administrateurs</span>
      <h1 style="font-size:clamp(2.4rem,6vw,3.6rem)">Finances</h1>
      <div id="app"></div>
    </div>
  </main>
  <div data-site-footer></div>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const C = window.SF_CONFIG;
      SF_AUTH.guard.fallback = () => `<div style="display:grid;gap:10px;margin-top:12px">
        <a class="btn btn-green" href="${C.appsheet.demandeDecaissement}" target="_blank" rel="noopener">Demande de décaissement ↗</a>
        <a class="btn btn-dark" href="${C.appsheet.decaissements}" target="_blank" rel="noopener">Suivi des décaissements ↗</a></div>`;
      SF_AUTH.guard({
        need: "admin", root: "#app", title: "Accès administrateurs",
        render: (el, user) => {
          el.innerHTML = `
            <div class="tabs" role="tablist">
              <button role="tab" aria-selected="true" data-tab="dash">Tableau de bord</button>
              <button role="tab" aria-selected="false" data-tab="list">Suivi des décaissements</button>
              <button role="tab" aria-selected="false" data-tab="form">Demande de décaissement</button>
            </div>
            <div data-panel="dash"></div>
            <div data-panel="list" hidden>${SF_AUTH.appsheetBlock(C.appsheet.decaissements, "Suivi des décaissements")}</div>
            <div data-panel="form" hidden>${SF_AUTH.appsheetBlock(C.appsheet.demandeDecaissement, "Nouvelle demande de décaissement")}</div>`;
          el.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => {
            el.querySelectorAll("[data-tab]").forEach((x) => x.setAttribute("aria-selected", x === b));
            el.querySelectorAll("[data-panel]").forEach((p) => (p.hidden = p.dataset.panel !== b.dataset.tab));
          }));
          SF_ADMIN.financeDashboard(el.querySelector('[data-panel="dash"]'), user);
        }
      });
    });
  </script>
</body>
</html>
